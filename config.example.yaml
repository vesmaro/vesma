vesma:
  # Consolidated layout (v2.1): everything under ~/.mnemos/
  #   ~/.mnemos/config.yaml  ← this file
  #   ~/.mnemos/data/         ← SQLite DBs (mnemos.db, vectors.db)
  #   ~/.mnemos/vault/        ← markdown vault
  #   ~/.mnemos/logs/         ← log files
  #   ~/.mnemos/cache/        ← embedding model cache, temp files
  # Old paths (~/mnemos-vault, ~/.mnemos as data_dir) are auto-migrated on first run.
  vault_path: ~/.mnemos/vault
  data_dir: ~/.mnemos/data

embedding:
  # vesma-embed-v1: bundled local model, works offline; alternatives: onnx (any HF model), ollama, sentence-transformers
  provider: nano
  # Alternative: Ollama (CPU works fine for embeddings)
  # provider: ollama
  # model: nomic-embed-text
  # ollama_url: http://localhost:11434
  # Alternative: sentence-transformers (requires ~2GB torch)
  # provider: sentence-transformers
  # model: intfloat/multilingual-e5-base

search:
  default_limit: 20
  # 0.5 balances FTS/vector legs: the vector dominance at 0.7 drowned
  # FTS-rank-1 matches (measured on both embedder regimes: governance
  # +5.2pp, knowledge +3.9pp, zero G-neg displacement — issue #300).
  hybrid_alpha: 0.5

api:
  host: 127.0.0.1
  port: 8787
  # --- Authentication (T-AUTH, ADR-0014) ---
  auth_enabled: false             # set true to enforce token auth on all routes
  totp_enabled: false             # set true to require TOTP 2FA after token login
  # totp_master_key is env-only — set via VESMA_API__TOTP_MASTER_KEY; required when totp_enabled=true
  session_ttl_sec: 28800          # session lifetime in seconds (range 300–86400; default 8 h)
  session_pin_ip: false           # bind session token to the creation client IP
  behind_tls_proxy: false         # set true when TLS terminates upstream (required for non-loopback bind)
  trusted_proxies: []             # CIDRs whose X-Forwarded-For is trusted, e.g. ["10.0.0.0/8"]
  # --- CORS (T-CORS, ADR-0014) ---
  cors_enabled: false             # set true to enable CORS response headers
  cors_allow_origins: []          # allowed origins, e.g. ["http://localhost:5173"]
  cors_allow_credentials: false   # allow cookies/auth headers cross-origin (cannot combine with origins=["*"])
  cors_allow_methods:             # HTTP methods exposed to cross-origin requests
    - GET
    - POST
    - DELETE
  cors_allow_headers:             # request headers exposed to cross-origin requests
    - Authorization
    - Content-Type

mcp:
  transport: stdio

watcher:
  # Directories to auto-index (used by `mnemos watch` when no args given)
  paths: []
  # paths:
  #   - ~/Projects
  #   - ~/LABs
  ignore_dirs:
    - .git
    - node_modules
    - __pycache__
    - .venv
    - venv
    - dist
    - build
  extensions:
    - .md
    - .py
    - .js
    - .ts
    - .yaml
    - .yml
    - .toml
    - .json
    - .txt
    - .sh
    - .sql
  max_file_size_kb: 512
  auto_scan: true

# ── Project code graph (ADR-0032 PG-0) ───────────────────────────────────────
# Symbol graph over REGISTERED project roots: 10 MCP tools + the /graph/ REST
# namespace. ON by default (owner decision 2026-09-28) — set enabled: false to
# hide the whole surface. The graph persists names, qnames, line ranges and
# signature shapes only (zero bytes of source, PG1); limits are fail-closed —
# a breach refuses the WHOLE index (PG7). See docs/en/user/project-graph.md
# (full guide), docs/en/user/mcp-tools.md ("Project graph tools")
# and docs/project/adr/0032-project-graph.md.
code_graph:
  # Master flag for the graph tool surface (MCP + REST).
  # ON by default (owner decision 2026-09-28 — graphs are first-class).
  enabled: true
  # One tail line in assemble_context output advertising graph freshness
  # (effective only when enabled).
  beacon: true
  # Hybrid search_graph (W-H): when a SYMBOL search returns zero hits, a
  # bounded read-only literal scan of the registered root answers with
  # match_kind:"literal" rows (path/line/snippet) + fallback_used:true.
  # Every row passes the same PG4 secrets detector as snippet issuance
  # (findings are dropped, never issued); poisoned paths (PG3) never
  # issue content; scan caps: file count / 1 MiB per file / ~2s.
  # false keeps search_graph symbol-only.
  literal_fallback: true
  # PG-1 M2 walk section of search_graph (ADR-0038): when ON, every
  # symbol-hitting search ALSO answers a SEPARATE section
  # walk: {origins, nodes, edges, truncated, epoch, walk_cursor/has_more}
  # — the hits' neighbourhood (in+out from every origin, depth ≤ 2,
  # quota k = min(ceil(limit/5), limit//2), caps fanout 32 / total work
  # 512 standing independently of k, PG1 node rows only, never mixed
  # into results, present only when it fired). Every walk execution
  # writes its own search-walk audit row priced with out_tokens /
  # avoided_bytes. Default OFF — the flag-off period is the «search +
  # read» baseline the token-economics verdict compares against; the
  # operator opts in deliberately.
  search_walk: false
  # Watch poll (mnemos_watch_start / POST /watch/start): armed by default,
  # inert until an explicit registration; the master gate applies on top.
  watch: true
  # Fail-closed index ceilings per project (PG7).
  index_max_files: 20000
  index_max_source_mb: 500
  # Operator's escape hatch for known-fake secret fixtures (issue #449):
  # repo-relative fnmatch globs whose files SKIP poison-marking at index
  # time (still indexed normally). A previously-poisoned path that now
  # matches is un-poisoned on the next index run — audited as
  # "allowlist-unpoison", never silent. The PRODUCT default stays []
  # — PG3 is a security gate, not an inconvenience: keep the allowlist
  # empty unless your repo carries known-fake secret FIXTURES. The
  # per-range issuance scan (PG4) is NEVER waived by the allowlist.
  # Note: removing a glob is not retroactive (a cleaned file stays clean
  # until its content changes); fnmatch "*" matches across "/" too.
  secret_allowlist: []
  # The canonical fixture pattern (fake-secret test data), as applied in
  # practice: test trees and benchmark trees only — never source trees.
  # secret_allowlist:
  #   - "tests/**"
  #   - "benchmarks/**"
  # Ephemeral-directory exclusion (defect 2026-10-03: a git worktree
  # checked out INSIDE the registered root was indexed like first-party
  # sources — duplicated symbols, re-poisoned fixtures). Directory globs
  # pruned ON TOP of the built-in denylist: a bare name matches a
  # directory of that name at ANY depth; an entry with "/" matches the
  # repo-relative directory path (fnmatch). Setting the field REPLACES
  # this default list — the built-in denylist (.git/wt/node_modules & co)
  # can never be lifted. Env: VESMA_CODE_GRAPH__EXCLUDE_GLOBS (JSON).
  exclude_globs: ["wt", ".venv", "venv", "node_modules", "dist", "build", ".tox", ".git"]
  # Watch poll: global registration cap + adaptive interval
  # base + 1s per 500 indexed files, capped.
  watch_max_registrations: 8
  watch_base_interval_sec: 5.0
  watch_interval_per_500_files: 1.0
  watch_max_interval_sec: 60.0
  # NATIVE auto-indexing (zero-touch): every MCP call / pre_llm_call hook
  # emits an activity hint; a project whose cwd carries a packaging
  # manifest (pyproject.toml / setup.py / package.json / go.mod /
  # Cargo.toml — a bare .git does NOT count) auto-registers and indexes
  # itself in the background. See docs/*/user/project-graph.md.
  auto_index: true
  # Global cap on AUTO-registrations (manual registrations never count);
  # further auto-registrations are skipped with an audit row.
  auto_register_max_projects: 64
  # Minimum seconds between background auto (re)index runs per project.
  auto_reindex_min_interval_sec: 300.0
  # May a connected MCP agent register project roots via
  # mnemos_register_project? (issue #464) Registration IS a read-scope
  # grant: the registered tree becomes readable through the graph tools
  # by every agent on the server. false reserves registration to the
  # operator (vesma graph register — the CLI path is never gated); a
  # gated attempt is refused AND audited ("manual-register-refused").
  # Default true under the single-user stdio assumption.
  agent_registration: true

# ── Federation (Phase 0 batch sync, issue #85) ───────────────────────────────
# Operator-curated, OFFLINE, cron-triggered batch sync between two mnemos
# instances. NOT networked — transfer is out-of-band (rsync / scp / shared
# volume by the operator). See ArchCom 2026-07-17 federation contract §3.1.
federation:
  # Whitelist of project slugs eligible for sync. Only records whose
  # project: tag matches a slug in this list are included in
  # `mnemos sync export`. Empty list = no projects are eligible.
  # The receiving side re-applies the same filter on import.
  shared_projects: []
  # shared_projects:
  #   - mnemos
  #   - project-umbra
  # TTL (hours) for the per-run moderation mapping table. The mapping is
  # in-memory only and NEVER replicated (it is a leak surface). After
  # expiry, a fresh mapping is issued on the next moderation run.
  # Range: 1–168 (1 hour to 7 days). Default: 24.
  moderation_mapping_ttl_hours: 24
  # Fraction of content that must be redacted/anonymized to trigger a
  # `refuse` verdict (contract §2.2). If >threshold of content is
  # redacted or anonymized, the record is refused (no useful remainder).
  # Range: 0.0–1.0. Default: 0.8 (80%).
  moderation_refuse_threshold: 0.8
  # ── Per-peer ACL — Phase 1 prerequisite (contract §3.2, §6, ADR-0016) ──
  # Keyed by peer A2A id (e.g. `mnemos-A`). Empty dict = no peers
  # configured = the federation server refuses all pull requests
  # (fail-closed). Each peer defines its own bearer token env name,
  # allowed projects/types, rate limit, and optional mTLS cert
  # fingerprint. `shared_projects` above is the global filter;
  # `allowed_projects` per peer is a subset filter on top.
  # All values below are RFC-reserved dummies — never real tokens.
  peers: {}
  # peers:
  #   mnemos-A:
  #     # NAME of the env var holding the per-peer bearer token
  #     # (format: mnk_fed_<peer_id>_<random> per ADR-0016). Never the
  #     # value — the server reads the token from this env var at
  #     # request time.
  #     bearer_token_env: VESMA_FED_PEER_A_TOKEN
  #     # Which projects this peer may pull. Empty = none (fail-closed).
  #     # ["*"] = all projects in `shared_projects` (explicit wildcard).
  #     allowed_projects:
  #       - mnemos
  #       - project-umbra
  #     # Which record types this peer may pull. Empty = none.
  #     # ["*"] = all types.
  #     # Valid: decision / learning / bug-pattern / rule / open-question
  #     #        / checkpoint / session
  #     allowed_types:
  #       - decision
  #       - learning
  #       - bug-pattern
  #     # Per-peer rate limit on pull requests (contract §8 — DDoS
  #     # mitigation). Range: 1–600. Default: 30/min.
  #     rate_limit_per_minute: 30
  #     # Optional SHA-256 fingerprint of the peer's mTLS client cert,
  #     # for pinning. If set, the server rejects connections whose
  #     # client cert fingerprint does not match. If null, mTLS pinning
  #     # is not enforced for this peer (operator opts in).
  #     # Example dummy (SHA-256 of empty string, 64 hex chars):
  #     mtls_cert_fingerprint: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855

# ── Background secrets scanner (Layer 2 defence-in-depth, issue #89) ──────────
# Periodically re-scans the whole corpus for secrets missed by the
# write-path scanner (Layer 1, #86) and auto-tags `mnemos:no-federate`.
# Re-uses `secrets_detector.detect_secrets` unchanged (DRY — one source
# of truth for patterns). See ArchCom 2026-07-17 federation contract
# §2.2.1. The scanner runs on its own daemon thread alongside the
# background processor; it never blocks the MCP server or HTTP API.
scanner:
  # Master switch. When false, `start()` is a no-op and the scanner does
  # not run. Defence-in-depth is on by default — opt out explicitly.
  enabled: true
  # Wall-clock interval between automatic scan passes. Range: 1–168
  # (1 hour to 7 days). Default: 6h per contract §2.2.1.
  interval_hours: 6
  # When true, `run_scan` only scans records whose created_at OR
  # updated_at is newer than the last successful scan. When false, every
  # scan is a full corpus scan. The CLI `--full` flag forces a full scan
  # for one run.
  incremental: true

# ── mnemos-mesh gRPC client (Phase 3, issue #105 M3) ─────────────────────────
# Python gRPC client (mnemos.mesh_client.MeshClient) that talks to the
# `mnemos-mesh` Go binary over a Unix socket. The mesh is a dumb transport
# (criterion 1) — moderation and storage stay in Python (criterion 2/11).
# OFF by default; enable after deploying the mesh binary. See ArchCom
# 2026-07-17 federation contract §3.1.
mesh:
  # Master switch. When false, MeshClient is not constructed and the
  # MCP/HTTP paths do not attempt to talk to the mesh. Enable after the
  # mesh binary is deployed and the socket is reachable.
  enabled: false
  # Filesystem path to the mnemos-mesh Unix socket. The mesh binary
  # creates the socket; mnemos connects to it. Default follows the
  # systemd-tmpfiles convention for runtime sockets owned by the
  # mnemos user.
  socket_path: /run/mnemos/core.sock
  # Per-RPC deadline in seconds. Short enough that a dead mesh is noticed
  # quickly, long enough for a local Unix-socket round trip.
  timeout_s: 2.0

# ── Update check (issue #445) ────────────────────────────────────────────────
# Quiet version check against PyPI: one stdlib GET of the version manifest
# (3s timeout, no telemetry), served from a 24h cache in
# <data_dir>/update-check.json. Surfaces: the `update_available` field of
# `mnemos_stats`, a stderr hint on `vesma --version`, and one INFO line at
# server start. Hard env kill switch (independent of this section):
# VESMA_UPDATES_CHECK=off
updates:
  # Set false (env: VESMA_UPDATES__CHECK_ENABLED=false) to stop all
  # version checks. Default: on.
  check_enabled: true

# ── Native awareness heartbeat (ADR-0035, W2a wave 0) ─────────────────────────
# The "eye/swarm" delivery contour: a delta-gated, observed-only awareness
# tail riding EVERY MCP tool response through the single call_tool
# injection point — no manual invocation, zero changes in foreign
# harnesses. Delivery fires on the first tool call after a peer write;
# the delta check is a sub-millisecond SELECT EXISTS probe. See
# docs/*/user/mcp-tools.md ("Native awareness heartbeat") and
# docs/project/adr/0035-native-awareness-delivery.md.
awareness:
  # The shadow -> canary -> default-on ladder. off (default) is the kill
  # switch: engine behaviour byte-identical to the pre-ADR-0035 build.
  #   off    — fully inert (no probe, no cursor, no events, no tail)
  #   shadow — wave 0: compose + events in the metrics sidecar, nothing
  #            rendered into agent responses (the measuring wave)
  #   canary — wave 1: the envelope renders as the last TextContent
  #   on     — wave 2: the default flips after the wave 0/1 gates close
  # Env: VESMA_AWARENESS__NATIVE_HEARTBEAT_MODE=shadow
  native_heartbeat_mode: "off"
  # C14 rate cap: heartbeat compositions per (project, agent) per minute
  # (in-process; the key carries no session — session churn must not
  # reopen the window). 0 disables. Over-limit suppresses the tail with
  # a heartbeat_suppressed{rate_cap} event, never an error.
  # Env: VESMA_AWARENESS__HEARTBEAT_RATE_LIMIT_PER_MINUTE=0
  heartbeat_rate_limit_per_minute: 30

# ── Logging (v2.1) ───────────────────────────────────────────────────────────
# File logging with rotation. Set log_file to empty ("") for stderr-only output.
logging:
  level: INFO                    # DEBUG | INFO | WARNING | ERROR
  log_file: ~/.mnemos/logs/mnemos.log
  max_file_size_mb: 10           # rotating file handler — max size per file
  backup_count: 3                # keep N rotated files
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
  date_format: "%Y-%m-%d %H:%M:%S"
