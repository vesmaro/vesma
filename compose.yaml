# Vesmaro (Mnemos) — compose deployment from the repo root
#
# Uses the published image — NO local build required.
# The canonical single-host path is deploy/docker/ (same image, vesmaro-*
# resource names); this root file keeps the historic mnemos-* names for
# existing podman-compose users.
#
# Запуск:    TOTP_MASTER_KEY=$(openssl rand -hex 32) docker compose up -d
#            (podman-compose тоже подходит; ключ можно положить в .env рядом)
# Логи:      docker compose logs -f mnemos
# Остановка: docker compose down
#
# С Ollama:  docker compose --profile ollama up -d
#            затем: docker exec mnemos-ollama ollama pull nomic-embed-text

services:
  mnemos:
    image: ghcr.io/vesmaro/vesma:${VESMA_IMAGE_TAG:-5.1.2}
    container_name: mnemos
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      # Canonical VESMA_* env names only (6.0.0 retired the ADR-0031
      # dual-prefix spellings MNEMOS_API__* / VESMARO_API__*).
      # An empty key is rejected at startup (0.0.0.0 bind requires auth+TOTP).
      - VESMA_API__TOTP_MASTER_KEY=${TOTP_MASTER_KEY:?set TOTP_MASTER_KEY, e.g. openssl rand -hex 32}
      - VESMA_CONFIG=/app/config.yaml
    volumes:
      - mnemos-data:/data
      - mnemos-vault:/vault
      - ./config.container.yaml:/app/config.yaml:ro
    healthcheck:
      # Unauthenticated /health endpoint; kept CLI-independent on purpose
      # (the CLI binary name changes in the 5.0.0 rebrand).
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Optional: local Ollama for embeddings (CPU mode)
  ollama:
    image: docker.io/ollama/ollama:latest
    container_name: mnemos-ollama
    profiles:
      - ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  mnemos-data:
  mnemos-vault:
  ollama-data:
