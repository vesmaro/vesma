# Pack manifest (engine-shipped): in-process board component.
# Contract: specs/component-manifest/v1 (1.0.0-draft.2). Written as if by
# the install flow — hands-off for components (CM §3.1).
apiVersion: vesma.component/v1
kind: in-process
metadata:
  name: board
  version: 5.4.0-dev
  tier: optional
  description: "Веб-панель супервайзера: статус компонентов, логи и ручное управление (in-process python-модуль)."
  provenance:
    repo: https://github.com/vesmaro/vesma
    license: Apache-2.0
in_process:
  module: vesma.service.board
  entrypoint: create_component
  python:
    version: ">=3.11"
health:
  checker: callback
  callback: "vesma.service.board:health"
  startup:
    grace: 30s
    interval: 5s
    timeout: 2s
config:
  schema_inline:
    type: object
    additionalProperties: false
    properties:
      bind:
        type: string
        # Loopback-only is the v1 security posture (public-bind edge):
        # anything else fails config validation and REFUSES the start
        # (CONFIG_INVALID, fail-closed). Widening the bind is an explicit
        # config change for a future wave — never a schema afterthought.
        # IPv6 loopback: bare "::1" (default port) or the bracketed
        # "[::1]:<port>" form; a colon-separated port is optional otherwise.
        pattern: "^((localhost|127\\.0\\.0\\.1)(:[0-9]{1,5})?|::1|\\[::1\\](:[0-9]{1,5})?)$"
        default: "127.0.0.1:8080"
        description: "Адрес, который слушает board (только loopback, v1)."
      log_level:
        type: string
        enum: [debug, info, warn, error]
        default: info
