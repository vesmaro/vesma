# Vesma (Vesma) — Docker / Docker Compose deployment (pre-built image)
#
# Full docs: docs/en/admin/runbooks/container-deployment.md
# Umbrella:  deploy/README.md
#
# Start:   cp .env.example .env  (fill TOTP_MASTER_KEY), then
#          docker compose up -d        # or: podman-compose up -d
# Logs:    docker compose logs -f vesma
# Stop:    docker compose down

services:
  vesmaro:
    image: ghcr.io/vesmaro/vesma:${VESMARO_IMAGE_TAG:-5.2.0}
    # Legacy namespace (pre-rebrand releases): ghcr.io/korrnals/mnemos
    container_name: vesma
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      # Dual-prefix contract (ADR-0031): 4.x images read MNEMOS_API__*,
      # 5.x images read VESMARO_API__* — set both from one secret value.
      # An empty key is rejected at startup (auth_enabled + totp_enabled are
      # on in the baked container config, required for the 0.0.0.0 bind).
      - MNEMOS_API__TOTP_MASTER_KEY=${TOTP_MASTER_KEY:?set TOTP_MASTER_KEY in .env}
      - VESMARO_API__TOTP_MASTER_KEY=${TOTP_MASTER_KEY:?set TOTP_MASTER_KEY in .env}
    volumes:
      - vesma-data:/data
      - vesma-vault:/vault
    healthcheck:
      # Unauthenticated /health endpoint; kept CLI-independent on purpose
      # (the CLI binary name changes in the 5.0.0 rebrand).
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Optional: local Ollama for embeddings (CPU mode)
  #   docker compose --profile ollama up -d
  #   docker exec vesma-ollama ollama pull nomic-embed-text
  # then set embedding.provider=ollama in the container config.
  ollama:
    image: docker.io/ollama/ollama:latest
    container_name: vesma-ollama
    profiles:
      - ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  vesma-data:
  vesma-vault:
  ollama-data:
