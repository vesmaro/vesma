# Kubernetes-style pod manifest for `podman kube play` — single-host Podman.
# For a real cluster (K8s/K3s) use the Helm chart: deploy/helm/vesma/.
#
# Usage:
#   printf 'VESMA_API__TOTP_MASTER_KEY=<your-key>\n' \
#     | podman secret create vesma-totp -
#   podman volume create vesma-data && podman volume create vesma-vault
#   podman kube play deploy/podman/kube/vesma-pod.yaml
# Stop:
#   podman kube down deploy/podman/kube/vesma-pod.yaml
apiVersion: v1
kind: Pod
metadata:
  name: vesma
  labels:
    app: vesma
spec:
  containers:
    - name: api
      # Published image (org namespace). Local build alternative:
      #   podman build -t localhost/vesma:latest -f Containerfile .
      image: ghcr.io/vesmaro/vesma:5.2.0
      ports:
        - containerPort: 8787
          hostPort: 8787
          protocol: TCP
      env:
        - name: VESMA_CONFIG
          value: /app/config.yaml
      # Canonical VESMA_* names only (6.0.0): the secret carries
      # VESMA_API__TOTP_MASTER_KEY (see header example).
      envFrom:
        - secretRef:
            name: vesma-totp
      livenessProbe:
        httpGet:
          path: /health
          port: 8787
        initialDelaySeconds: 20
        periodSeconds: 30
      readinessProbe:
        httpGet:
          path: /health
          port: 8787
        initialDelaySeconds: 5
        periodSeconds: 10
      resources:
        limits:
          memory: "2Gi"
          cpu: "2"
        requests:
          memory: "512Mi"
          cpu: "500m"
      volumeMounts:
        - name: vesma-data
          mountPath: /data
        - name: vesma-vault
          mountPath: /vault
  volumes:
    - name: vesma-data
      persistentVolumeClaim:
        claimName: vesma-data
    - name: vesma-vault
      persistentVolumeClaim:
        claimName: vesma-vault
