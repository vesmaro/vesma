apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "vesma.fullname" . }}-test-connection"
  labels:
    {{- include "vesma.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox:1.36
      command: ["wget"]
      args: ["-qO-", "{{ include "vesma.fullname" . }}:{{ .Values.service.port }}/health"]
