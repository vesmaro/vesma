# Mnemos integration targets — harness detection + deploy maps.
#
# A target is "detected" if ANY of its detect paths exist (after ~ expansion).
# The deploy map tells `mnemos util-setup` where to copy each artefact kind.
#
# `format: copy` means files are copied verbatim (no templating).
# Future formats (symlink, template) can be added without breaking the schema.
#
# `precedence:` — memory-switch mode (ADR-0034, MS-0). Default and only
# enforced mode: `overlay+mirror` (the vesma pack overlays the harness's own
# canon — local instructions win on divergence — while memory writes mirror
# into the vesma store). `replace` / `off` are recognized but NOT enforced
# yet (they arrive with the MS-1 wave); any other value fails at parse time.

targets:
  copilot:
    detect:
      - path: "~/.copilot/instructions"
      - path: "~/.copilot/skills"
    deploy:
      instructions: "~/.copilot/instructions/"
      skills: "~/.copilot/skills/"
      # Canon JSON Schemas (kind: schemas) — byte-identical copies plus a
      # stamped sidecar manifest (vesma-schemas.manifest.json); consumers
      # like the mnemos-eyes Go validator read them straight from here.
      schemas: "~/.copilot/schemas/"
    format: copy
    precedence: overlay+mirror

  generic-copilot:
    detect:
      - path: "~/.config/Code/User/prompts"
    deploy:
      prompts: "~/.config/Code/User/prompts/"
    format: copy
    precedence: overlay+mirror

  cursor:
    detect:
      - path: "~/.cursor/rules"
    deploy:
      instructions: "~/.cursor/rules/"
    format: copy
    precedence: overlay+mirror

  hermes:
    detect:
      - path: "~/.hermes/config.yaml"
      - path: "$HERMES_HOME/config.yaml"
    deploy:
      plugin: "~/.hermes/plugins/vesma/"
      instructions: "~/.hermes/skills/"
      skills: "~/.hermes/skills/"
    format: copy
    precedence: overlay+mirror

  # ZCode agent. Skills live as <skills-dir>/<name>/SKILL.md (layout:
  # nested); MCP is registered in the user config under mcp.servers,
  # merged in place so other servers survive. ZCode reads ~/.zcode/AGENTS.md
  # natively as standing user instructions, so the always-on behavioral pack
  # deploys as a stamped block inside it (kind: agents_md).
  zcode:
    detect:
      - path: "~/.zcode/cli/config.json"
      - path: "~/.zcode"
    deploy:
      skills: "~/.zcode/skills/"
      # Canon JSON Schemas (kind: schemas) — byte-identical copies plus a
      # stamped sidecar manifest (vesma-schemas.manifest.json).
      schemas: "~/.zcode/schemas/"
      agents_md: "~/.zcode/AGENTS.md"
    format: copy
    precedence: overlay+mirror
    layout: nested
    mcp:
      config: "~/.zcode/cli/config.json"
      format: zcode

  # Universal AGENTS.md-standard target (~/.agents is read natively by
  # ZCode, Claude Code, Codex, Cursor and others). Skills deploy as
  # <name>/SKILL.md; MCP registers into the top-level mcpServers key. The
  # always-on behavioral pack deploys as a stamped block inside
  # ~/.agents/AGENTS.md — the one shared channel for every harness that
  # follows the AGENTS.md standard (Claude Code included: one mechanism,
  # not a diverging CLAUDE.md writer).
  agents:
    detect:
      - path: "~/.agents"
    deploy:
      skills: "~/.agents/skills/"
      # Canon JSON Schemas (kind: schemas) — byte-identical copies plus a
      # stamped sidecar manifest (vesma-schemas.manifest.json).
      schemas: "~/.agents/schemas/"
      agents_md: "~/.agents/AGENTS.md"
    format: copy
    precedence: overlay+mirror
    layout: nested
    mcp:
      config: "~/.agents/mcp.json"
      format: agents

  # OpenCode (opencode.ai). Reads AGENTS.md natively — global standing
  # instructions live at ~/.config/opencode/AGENTS.md — so the always-on
  # behavioral pack deploys there as a stamped block (kind: agents_md).
  # Skills use the native global nested layout; MCP registers in
  # opencode.json under the top-level "mcp" key (server names map DIRECTLY
  # to entries: {"type": "local", "command": [...]}).
  opencode:
    detect:
      - path: "~/.config/opencode"
    deploy:
      skills: "~/.config/opencode/skills/"
      agents_md: "~/.config/opencode/AGENTS.md"
    format: copy
    precedence: overlay+mirror
    layout: nested
    mcp:
      config: "~/.config/opencode/opencode.json"
      format: opencode

  # Pi coding agent (@earendil-works/pi-coding-agent). Pi has no built-in
  # MCP client by design — tools arrive via TypeScript extensions, so the
  # shipped bridge extension IS the MCP registration: deploying it connects
  # Pi to the mnemos server (spawn `mnemos mcp-server`, stdio JSON-RPC).
  # The bridge also injects the always-on behavioral pack into Pi's system
  # prompt via its before_agent_start hook (Pi has no AGENTS.md surface).
  # Skills use the native nested layout under ~/.pi/agent/skills/.
  # NOTE: Pi also reads ~/.agents/skills/ — when both targets are deployed,
  # prefer --target pi to avoid duplicate skill listings.
  pi:
    detect:
      - path: "~/.pi/agent"
      - path: "~/.pi"
    deploy:
      skills: "~/.pi/agent/skills/"
      extensions: "~/.pi/agent/extensions/"
    format: copy
    precedence: overlay+mirror
    layout: nested
    mcp:
      config: "~/.pi/agent/extensions/vesma-mcp.ts"
      format: pi