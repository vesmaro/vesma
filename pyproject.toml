[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vesma"
version = "5.5.0"
description = "Vesma — standalone memory & knowledge server for AI agents (Vesmaro Project)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]

dependencies = [
    # Core
    "pydantic>=2.0",
    # CVE-2026-4539 (pygments transitive via rich/pytest) fixed in 2.20.0;
    # GHSA-4xgf-cpjx-pc3j fixed in 2.14.2.
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0.3",
    "aiosqlite>=0.20",
    # Vector Search (NM-1c, ADR-0021): the bundled vesma-embed model runs on
    # onnxruntime directly — chromadb is gone from the runtime. These three
    # were transitive via chromadb before and are now direct deps.
    "onnxruntime>=1.20",
    "tokenizers>=0.21",
    "huggingface_hub>=0.30",
    # API
    "fastapi>=0.138.0",
    # CVE-2026-40347/42561/53538/53539/53540 fixed in 0.0.31.
    "python-multipart>=0.0.31",  # multipart form data for POST /api/v1/import (UploadFile)
    "uvicorn[standard]>=0.30",
    # MCP server (ADR-0023): the agent-harness surface is the primary product
    # surface — the SDK ships in core so the base install can serve agents.
    # stdio transport only; the upstream [cli] extra adds nothing for us
    # (typer + python-dotenv were already core). Import isolation: the SDK is
    # imported ONLY by vesmaro.mcp_server via the CLI subcommand handler
    # (guard test test_mcp_core_isolation).
    "mcp>=2.0,<3.0",
    # Project code graph (ADR-0032, owner decision 2026-09-28 «graphs on by
    # default»): ecosystem components build on the graphs, so the parser
    # stack is CORE, not an extra — a default-enabled flag over a missing
    # dependency would be a silent degradation. Canonical PyPI name is
    # ``tree-sitter`` (the old ``py-tree-sitter`` distribution was renamed;
    # the old name no longer resolves). ``tree-sitter-python`` 0.25.0
    # requires ``tree-sitter~=0.24``, hence the <0.27 ceiling keeps the
    # pair resolver-stable; language packs (PG-3) pin to the same
    # tree-sitter org release line here.
    "tree-sitter>=0.24,<0.27",
    "tree-sitter-python>=0.25.0,<0.26",
    # Go grammar (#470): same org (tree-sitter/tree-sitter-go), 0.25.0 is
    # the python-pack's sibling release — same ceiling discipline.
    "tree-sitter-go>=0.25.0,<0.26",
    # Transitive CVE closure (M15.5.1) — pinned directly to force resolver
    # past vulnerable transitive versions still pulled by fastapi/uvicorn.
    # Floor 3.14.3 (#267): PYSEC-2026-3546/3547 fixed in 3.14.2,
    # PYSEC-2026-3545 fixed in 3.14.3 — 3.14.3 covers all three.
    "aiohttp>=3.14.3,<4.0",
    "starlette>=1.3.0,<2.0",   # CVE-2026-48817, 48818, 54282, 54283 fixed in 1.3.x
    # Transitive CVE closure (M15.5.2) — pinned directly to force resolver
    # past vulnerable transitive versions pulled by mcp/httpx.
    "pyjwt>=2.15.0",           # PYSEC-2026-120/175-179 fixed in 2.13.0; 4140-4152 fixed in 2.14.0, 4141 in 2.15.0 (4146 unfixed — ignored, #476)
    "urllib3>=2.8.0",          # PYSEC-2026-141/142 fixed in 2.7.0; 4177 fixed in 2.8.0
    "python-dotenv>=1.2.2",    # CVE-2026-28684 fixed in 1.2.2
    "idna>=3.15",              # PYSEC-2026-215 fixed in 3.15
    "pygments>=2.20.0",        # CVE-2026-4539 fixed in 2.20.0
    # CLI
    "typer>=0.26.7",
    "rich>=13.0",
    # File watching
    "watchdog>=4.0",
    # Web scraping
    "trafilatura>=1.12",
    "httpx>=0.28.1",
    # Text processing
    "python-frontmatter>=1.1",
    # Utilities
    "python-dateutil>=2.9.0.post0",
    # Scheduling (M5 — policy engine / automation)
    "apscheduler>=3.10",
    # T-AUTH (ADR-0014): bearer tokens + TOTP 2FA + rate limiting
    "pyotp~=2.9",
    "slowapi~=0.1.9",
    # CVE-2026-26007, PYSEC-2026-35/36, GHSA-537c-gmf6-5ccf fixed in 48.0.1;
    # PYSEC-2026-3552 fixed in 50.0.0 (#267). Major bump, but our usage is
    # stable primitives only (Fernet, AESGCM, PBKDF2HMAC, x509/rsa/hashes).
    "cryptography>=50.0.0",  # Fernet for TOTP-secret-at-rest; also transitive via httpx[http2]
    # mnemos-mesh Phase 3 (M3) — gRPC client over Unix socket (MnemosCore API).
    # Pinned <2.0 to avoid breaking API changes in a major bump.
    "grpcio>=1.62,<2",
    "grpcio-tools>=1.62,<2",
]

[project.optional-dependencies]
anthropic = [
    "anthropic>=0.25",
]
openai = [
    "openai>=1.0",
]
gemini = [
    "google-generativeai>=0.5",
]
azure = [
    # Azure OpenAI uses the same openai SDK with azure endpoint config
    "openai>=1.0",
]
ollama = [
    "ollama>=0.3",
]
sentence-transformers = [
    "sentence-transformers>=3.0",
]
training = [
    # NM-1b training stack — OUTSIDE the runtime deps by ADR-0021 (training
    # happens in a container/venv, never in the server environment).
    # onnxruntime/tokenizers/huggingface_hub moved to core deps in NM-1c
    # (the runtime nano embedder needs them directly).
    "torch>=2.2",
    "transformers>=4.51",
    "onnx>=1.17",
    "sentence-transformers>=3.0",
]
openvino = [
    "optimum[openvino]>=1.19",
]
mcp = [
    # Empty since ADR-0023 (4.1.0): the MCP SDK moved into core dependencies
    # (#185 history: mcp_server.py was ported off the 1.x runtime-decorator
    # API; the >=2.0,<3.0 floor moved to `dependencies` unchanged). This extra
    # remains as a no-op alias so legacy commands like
    # `pip install "vesmaro[mcp]"` keeps resolving (the old `mnemos-memory-server` extra matrix gets a deprecation pointer release).
]
pdf = [
    "pymupdf>=1.24",
]
# Project code graph: moved to CORE dependencies (owner decision
# 2026-09-28 — graphs default-on; the [code-graph] extra is retired in
# the same unreleased wave, so no backcompat alias is needed).
docx = [
    "python-docx>=1.1",
]
dev = [
    # CVE-2025-71176 fixed in 9.0.3.
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.0",
    "ruff>=0.15,<0.16",  # CI pins to 0.15.x to match local format
    "mypy>=1.11",
    "bandit[toml]>=1.7",
    "pip-audit>=2.7",
    # Security floors for tooling pip-audit scans in the dev venv (#267):
    # `pip` arrives transitively via pip-audit -> pip-api, `setuptools` via
    # grpcio-tools' runtime dependency — both land in the audited
    # environment without any direct pin. PYSEC-2026-3721 fixed in pip 26.2;
    # PYSEC-2026-3447 fixed in setuptools 83.0.0.
    "pip>=26.2",
    "setuptools>=83.0.0",
    "types-PyYAML",
]
all = [
    "vesmaro[anthropic,openai,gemini,azure,ollama,mcp,pdf,docx,dev]",
]

# PEP 735 dev group (#337, fix wave for #335): plain `uv sync` (and with it
# `uv run`) now installs the gate tools too, without remembering `--extra
# dev`. This kills the PATH-fallthrough class where `uv run pytest` /
# `.venv/bin/pytest` silently resolved a foreign interpreter because the
# repo venv held no pytest. The group self-references the `dev` EXTRA so
# the tool list lives in exactly one place — pip workflows
# (`pip install -e ".[dev]"`) and `uv sync --extra dev` keep working
# unchanged (uv installs the default `dev` group plus any requested extras).
[dependency-groups]
dev = ["vesma[dev]"]

[project.scripts]
# Canonical + short hook (owner-approved, GWS card #331 amendment)
vesmaro = "vesmaro.cli.main:cli_main"
vesma = "vesmaro.cli.main:cli_main"
vesmaro-train = "vesmaro.train_entry:main"
# Legacy compatibility commands (dual-import period; retire no earlier than 6.0)
mnemos = "vesmaro.cli.main:app"
mnemos-train = "vesmaro.train_entry:main"

# Korrnals/release-pipeline symlinks (local pipeline mode) must never enter
# the sdist: their absolute symlink targets break sdist extraction during
# `python -m build` (tarfile data filter raises AbsoluteLinkError) and the
# pipeline itself lives outside this repo. See .pipeline.yaml and
# scripts/run-release-local.sh.
# benchmarks/ is likewise excluded from BOTH sdist and wheel (ADR-0020 §4,
# owner directive 2026-08-30): benchmark artefacts are repo-local dev
# tooling, never shipped artefacts. Same exclude pattern as #179.
# training/ is excluded from BOTH sdist and wheel (ADR-0021 anti-scope:
# training code is separated from the runtime; the runtime never learns).
[tool.hatch.build.targets.sdist]
exclude = ["scripts/run-release-local.sh", "scripts/local-ci", "benchmarks", "training"]

[tool.hatch.build.targets.wheel]
packages = ["src/vesmaro", "src/mnemos"]
exclude = ["benchmarks", "training"]

# Ship the integration pack (instructions, skills, prompts, targets.yaml) inside
# the wheel so `mnemos integration setup` works from a pip-installed package,
# not just from a source checkout. The directory is mapped to
# `vesmaro/integrations/` so it is reachable via `importlib.resources.files(
# "vesmaro") / "integrations"`.
[tool.hatch.build.targets.wheel.force-include]
"integrations" = "vesmaro/integrations"
# Ship the setup scripts (mcp-setup.sh, install.sh, deploy.sh, setup-distrobox.sh)
# inside the wheel so `mnemos integration setup` can find mcp-setup.sh from a
# pip-installed package, not just from a source checkout. Mapped to
# `vesmaro/scripts/` — reachable via `importlib.resources.files("vesmaro") / "scripts"`.
#
# Enumerated file-by-file, NOT as a directory mapping (#481): scripts/ contains
# a machine-local symlink (run-release-local.sh, untracked since #481). A
# directory force-include walks it — in source-tree wheel builds it leaked the
# target's content into the artefact, and on any fresh clone the dangling
# symlink crashed every build (hatchling os.stat). Enumeration pins wheel
# content independent of checkout state; add new scripts here explicitly.
# The list equals the sdist-visible scripts (release wheels are built FROM the
# sdist): scripts/local-ci is sdist-excluded, so local-ci/run-all.sh ships in
# no wheel — source-tree builds used to differ here (latent divergence, #481).
"scripts/check_version.py" = "vesmaro/scripts/check_version.py"
"scripts/deploy.sh" = "vesmaro/scripts/deploy.sh"
"scripts/gen-proto.sh" = "vesmaro/scripts/gen-proto.sh"
"scripts/install.sh" = "vesmaro/scripts/install.sh"
"scripts/local-ci.sh" = "vesmaro/scripts/local-ci.sh"
"scripts/local-release.sh" = "vesmaro/scripts/local-release.sh"
"scripts/mcp-setup.sh" = "vesmaro/scripts/mcp-setup.sh"
"scripts/publish-all.mjs" = "vesmaro/scripts/publish-all.mjs"
"scripts/pypi-publish.sh" = "vesmaro/scripts/pypi-publish.sh"
"scripts/release.sh" = "vesmaro/scripts/release.sh"
"scripts/setup-distrobox.sh" = "vesmaro/scripts/setup-distrobox.sh"
"scripts/smoke-federation.sh" = "vesmaro/scripts/smoke-federation.sh"
"scripts/sync-peers.sh" = "vesmaro/scripts/sync-peers.sh"
"scripts/sync-readme-version.sh" = "vesmaro/scripts/sync-readme-version.sh"
"scripts/sync-version.mjs" = "vesmaro/scripts/sync-version.mjs"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# training/dataset/synthetic_templates.py: RU template strings are
# intentionally Cyrillic — that IS the synthetic RU corpus content
# (NM-1a, ADR-0021); RUF001's lookalike warning is noise here.
# Same for the smoke test that feeds RU strings through detect_lang().
"training/dataset/synthetic_templates.py" = ["RUF001"]
"tests/test_training_dataset.py" = ["RUF001"]
"tests/test_training_round3.py" = ["RUF001"]
# benchmarks/reports/generate_report.py: the Russian analysis text mixes
# Cyrillic and latin identifiers — RUF001's lookalike warnings are noise
# (same rationale as the synthetic RU corpus files).
"benchmarks/reports/generate_report.py" = ["RUF001", "E501"]
# benchmarks/strata/e2_d data-pool modules (E2 D-strata, E0 §3.6): the
# corpus content lives in one-line (slug, title, prose) tuples — the
# one-entry-per-line table IS the artifact's readable, diffable shape;
# wrapping each single-sentence prose string would obscure it (same
# E501 rationale class as generate_report.py).
"benchmarks/strata/e2_d/conflict_pairs.py" = ["E501"]
"benchmarks/strata/e2_d/replay224.py" = ["E501"]
# benchmarks/corpus/deterministic_embedder.py: the module's SOURCE BYTES are
# pinned by corpus_fingerprint() (sha256 over module bytes — see
# benchmarks/stands/s1_quality/run.py), which 8 baseline/manifest gates
# compare against recorded values. Ruff classifies the legacy `mnemos.*`
# import as third-party and wants it merged into the numpy block (I001);
# applying that cosmetic re-sort changes the fingerprint and falsely trips
# every S1/E2/E3 gate. Re-recording baselines for a whitespace change is
# forbidden (ADR-0020: event-driven triggers only). Suppress I001 for this
# file until the fingerprint no longer covers it (#337).
"benchmarks/corpus/deterministic_embedder.py" = ["I001"]
# src/mnemos/storage/sqlite_store.py: the search-v2 short-token guard
# (issue #314) carries the RU half of the `_FTS_STOPWORDS` frozenset and
# RU examples in its docstrings — that IS the intended content (same
# rationale as the synthetic RU corpus files); RUF001/RUF002 lookalike
# warnings are noise for genuinely Russian words like «его».
"src/vesmaro/storage/sqlite_store.py" = ["RUF001", "RUF002"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    # ADR-0017 D5 golden evaluation suite (tests/golden/) — deterministic,
    # part of the default run; deselect with `-m "not golden"`.
  "golden: D5 golden-set baseline metrics (precision/recall@k, injection-acceptance, A9 delta, ADR-0018 rewrite pair)",
]

[tool.mypy]
# Don't pin python_version — let each CI job (3.11/3.12/3.13) use its
# runtime Python version. Pinning to 3.11 causes mypy to reject PEP 695
# `type` statements in numpy stubs installed on 3.12/3.13 (syntax error
# that follow_imports=skip cannot suppress). The 3.11 CI job still
# catches 3.12+ features in our own code.
strict = true
ignore_missing_imports = true
warn_return_any = true
warn_unused_ignores = true

# The mcp SDK exposes some call sites without annotations upstream. Relax only
# the two strict checks they trip, scoped to the thin wrapper module, so the
# type-check result is the same whether or not the optional `mcp` extra is
# installed. (Pre-#185 this covered the untyped 1.x decorators; the 2.x
# constructor-registration port keeps the override for the remaining untyped
# call sites in the SDK boundary.)
[[tool.mypy.overrides]]
module = "vesmaro.mcp_server"
disallow_untyped_decorators = false
disallow_untyped_calls = false

# numpy stubs use PEP 695 `type` statement (Python 3.12+) which mypy
# doesn't support in all versions. Don't follow into numpy stubs and
# ignore any errors there — we only type-check our own code.
[[tool.mypy.overrides]]
module = "numpy"
follow_imports = "skip"
ignore_errors = true
[[tool.mypy.overrides]]
module = "numpy.*"
follow_imports = "skip"
ignore_errors = true

# training/ is anti-scope (ADR-0021): it never ships in the wheel and is not
# runtime code — type-checking it under --strict only produces noise. Skip
# following into it; mnemos.train_entry's import resolves as Any.
[[tool.mypy.overrides]]
module = "training"
follow_imports = "skip"
ignore_errors = true
[[tool.mypy.overrides]]
module = "training.*"
follow_imports = "skip"
ignore_errors = true

[tool.bandit]
exclude_dirs = [".venv", "tests"]
